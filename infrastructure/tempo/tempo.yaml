# Single-binary Tempo with local storage: fine for a laptop lab, not for production.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Derives RED metrics per span and the service graph (sentinel-api -> risk-engine, -> postgresql) and remote-writes
# them to Prometheus, which powers the Grafana service map.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      enable_virtual_node_label: true
      peer_attributes: [peer.service, db.system.name, db.system, server.address]
    span_metrics:
      dimensions: [http.request.method, http.route]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
