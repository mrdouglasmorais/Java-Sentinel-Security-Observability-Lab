global:
  # Short intervals make lab experiments visible within seconds. Production typically uses 15s-60s.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /actuator/prometheus
    # OpenMetrics is negotiated by default and carries exemplars (trace_id) on histogram buckets.
    static_configs:
      - targets: ["sentinel-api:8081"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
